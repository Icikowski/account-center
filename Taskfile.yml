# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"
vars:
  TAILWIND_CMD:
    sh: command -v tailwindcss >/dev/null 2>&1 && echo "tailwindcss" || echo "npx tailwindcss@latest"
  BUILD_VERSION:
    sh: echo ${BUILD_VERSION:-$(git describe --tags --exact-match ${GIT_REF:-HEAD} 2>/dev/null || echo "dev")}
  BUILD_COMMIT:
    sh: echo ${BUILD_COMMIT:-$(git rev-parse --verify ${GIT_REF:-HEAD})}
  BUILD_TIMESTAMP:
    sh: echo ${BUILD_TIMESTAMP:-$(date -u +"%Y-%m-%dT%H:%M:%SZ")}
tasks:
  lint:
    cmd: golangci-lint run --fix ./...
  fmt:
    cmds:
      - golangci-lint fmt ./...
      - go run github.com/shoenig/go-modtool@latest -w fmt go.mod
  deps:
    cmds:
      - go get -u ./...
      - go tool templui --force --installed add
  generate:
    cmds:
      - go generate ./...
      - go tool templ generate
      - "{{.TAILWIND_CMD}} -i ./internal/web/assets/sources/input.css -o ./internal/web/assets/css/style.css"
  build:
    cmd: go build -o ./bin/account-center ./cmd/account-center
  build-static:
    env:
      CGO_ENABLED: "0"
    cmd: |
      go build \
        -o ./bin/account-center \
        -tags netgo \
        -ldflags "\
          -s \
          -w \
          -extldflags '-static' \
          -X 'git.sr.ht/~icikowski/account-center/internal/buildinfo.version={{.BUILD_VERSION}}' \
          -X 'git.sr.ht/~icikowski/account-center/internal/buildinfo.commit={{.BUILD_COMMIT}}' \
          -X 'git.sr.ht/~icikowski/account-center/internal/buildinfo.timestamp={{.BUILD_TIMESTAMP}}' \
        " \
        ./cmd/account-center
  run:
    cmd: go run ./cmd/account-center
  test:
    cmd: go test -race -v ./...
  templ:
    cmd: |
      go tool templ generate \
        --watch \
        --proxy="http://localhost:8080" \
        --cmd="go run ./cmd/account-center" \
        --open-browser=false
  tailwind:
    cmd: |
      {{.TAILWIND_CMD}} \
        -i ./internal/web/assets/sources/input.css \
        -o ./internal/web/assets/css/style.css \
        --watch
  dev:
    cmd: task --parallel tailwind templ
